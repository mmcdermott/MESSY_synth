[build-system]
requires = ["setuptools>=80.9.0", "setuptools-scm>=9.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MESSY_synth"
dynamic = ["version"] # Makes setuptools-scm manage the version
authors = [
  {name="Matthew McDermott", email="mattmcdermott8@gmail.com"},
]
description = "Generate structurally-faithful synthetic raw data from any MEDS-Extract v0.7 MESSY config."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
  # 0.7.0 is the first release with the single-file MESSY config and the
  # `MessyConfig`/`TableConfig`/`EventConfig` API this package reflects over.
  "MEDS-extract>=0.7.0,<0.8",
  # The expression DSL whose AST we walk to infer column types. Pulled in
  # transitively by MEDS-extract, but imported directly here, so declared direct.
  "dftly>=0.7.0,<0.8",
  "polars>=1.38",
]

[dependency-groups]
dev = [
  "pre-commit<4",
  "ruff",
  "pytest",
  "pytest-cov",
  "pretty-print-directory",
  "yaml_to_disk",
  # shfmt-py bundles the `shfmt` binary used by the mdformat-shfmt pre-commit
  # hook. Pinning it here (in addition to the pre-commit hook's
  # additional_dependencies) gives a single source of truth and keeps local
  # `uv run mdformat ...` runs consistent with CI pre-commit runs.
  "shfmt-py==3.12.0.2",
  "pyyaml>=6.0.2",
]
docs = []

[tool.setuptools_scm]

[project.optional-dependencies]

[project.scripts]
MESSY-synth = "MESSY_synth.__main__:main"

[tool.pytest.ini_options]
addopts = [
  "--color=yes",
  "--doctest-modules",
  "--ignore=docs",
  "--ignore=AGENTS.md",
  "--ignore=CONTRIBUTORS.md",
  "--doctest-glob=*.md",
  "--doctest-continue-on-failure",
]
markers = [
  "slow: end-to-end tests that run a full MEDS-Extract pipeline (deselect with '-m \"not slow\"')",
]
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]

[project.urls]
Homepage = "https://github.com/mmcdermott/MESSY_synth"
Issues = "https://github.com/mmcdermott/MESSY_synth/issues"

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["docs/index.md"]

# Enable linters
[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "RUF", # Ruff-specific rules
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "N",   # pep8-naming
    "D",   # docstring-checker
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports in __init__ files
"test_*" = ["DTZ001"]  # Ignore datetimez in test files

[tool.ruff.lint.pep8-naming]
# Allow common abbreviations; "D" is used for distributions/datasets. MESSY is the
# name of the MEDS-Extract config format this package reads, and is always capitalized.
extend-ignore-names = ["*MEDS*", "*MESSY*", "NRT", "D", "L"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["MESSY_synth"]
